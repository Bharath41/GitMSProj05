spring.application.name=Billing-MS

#instance id
spring.application.instance-id=${spring.application.name}:${random.value}

#Provider MS port number
server.port=8092

#url to register with Eureka server
eureka.client.service-url.default-zone=http://localhost:8761/eureka

#Link MS with ConfigServer as Config client
spring.config.import=optional:configserver:

#context path
server.servlet.context-path=/BillingMS
